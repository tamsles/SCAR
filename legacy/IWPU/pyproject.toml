[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iwpu-reproduction"
version = "0.1.0"
description = "High-fidelity from-paper reimplementation of importance-weighted PU learning under distribution shift"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Independent reproduction contributors" },
]
keywords = [
  "positive-unlabeled learning",
  "distribution shift",
  "importance weighting",
  "reproducibility",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "numpy>=1.23.5,<2",
  "pandas>=1.5,<3",
  "scipy>=1.10,<2",
  "scikit-learn>=1.2,<2",
  "PyYAML>=6,<7",
  "torch>=2.0,<3",
  "torchvision>=0.15,<1",
  "tqdm>=4.66,<5",
  "matplotlib>=3.7,<4",
  "seaborn>=0.12,<1",
]

[project.optional-dependencies]
tabular = [
  "tableshift @ git+https://github.com/mlfoundations/tableshift.git@fca9429814703a07e3902d005d46563a207b7f0a",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["iwpu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

